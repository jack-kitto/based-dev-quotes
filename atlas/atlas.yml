version: 1
anchor:
  name: based-dev-quotes API
  need: Deliver a curated, searchable collection of developer quotes via a static JSON API
components:
  - id: quote-ingestion
    name: Quote Ingestion Pipeline
    needs: []
    code:
      - scripts/scrape.py
      - scripts/telegram_bot.py
      - scripts/process_submissions.py
    attrs:
      visibility: 0.2
      evolution: 0.2
      completeness: partial
      journey: collect
      consequence: raw-candidates
  - id: quote-extraction
    name: Quote Extraction & Scoring
    needs:
      - quote-ingestion
    code:
      - scripts/extract.py
    attrs:
      visibility: 0.4
      evolution: 0.4
      completeness: partial
      journey: process
      consequence: structured-quotes
  - id: quote-management
    name: Quote Validation & PR Integration
    needs:
      - quote-extraction
    code:
      - scripts/merge_pr.py
      - scripts/validate.py
      - scripts/validate.js
    attrs:
      visibility: 0.5
      evolution: 0.5
      completeness: partial
      journey: curate
      consequence: approved-quotes
  - id: static-api-generator
    name: Static API Generator
    needs:
      - quote-management
    code:
      - scripts/generate.py
      - scripts/generate.js
    attrs:
      visibility: 0.6
      evolution: 0.6
      completeness: ready
      journey: generate
      consequence: api-files
  - id: api-serving
    name: Static API Serving
    needs:
      - static-api-generator
    code:
      - api/v1/**/*.json
    attrs:
      visibility: 0.8
      evolution: 0.8
      completeness: shipped
      journey: serve
      consequence: public-endpoint
  - id: deployment
    name: Container Deployment & CI
    needs:
      - api-serving
    code:
      - .coolify.yml
      - .github/workflows/generate.yml
      - .github/workflows/scrape.yml
    attrs:
      visibility: 0.9
      evolution: 0.9
      completeness: ready
      journey: deploy
      consequence: operational
